<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globo de Notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1220;--glass:rgba(14,24,41,.84);--ink:#e8eef5;--mute:#93a4b6;--line:rgba(255,255,255,.11);--chip:rgba(255,255,255,.07);--acc:#4fd1c0;--amb:#f2b441;--stage:radial-gradient(ellipse at 50% 45%,#12305a 0%,#070e1c 78%);--h:calc(56px + env(safe-area-inset-top,0px))}
:root[data-theme="light"]{--bg:#eef2f6;--glass:rgba(255,255,255,.88);--ink:#14202b;--mute:#566574;--line:rgba(0,0,0,.1);--chip:rgba(0,0,0,.05);--acc:#0b6b63;--amb:#b7791f;--stage:radial-gradient(ellipse at 50% 45%,#e4edf6 0%,#bfd0e2 80%)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;font-variant-numeric:tabular-nums}
.top{position:fixed;inset:0 0 auto 0;height:var(--h);padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;gap:16px;z-index:5;background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:22px;height:22px;color:var(--acc)}
.brand span{font-weight:500;color:var(--mute)}
.search input{width:190px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink);font:inherit;outline:0}
.search input:focus{border-color:var(--acc)}
.fx{display:flex;gap:18px;margin-left:auto;overflow-x:auto;white-space:nowrap;font-size:12px;color:var(--mute);scrollbar-width:none}
.fx b{color:var(--ink);font-weight:700}
.ib{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:14px;flex:none}
#stage{position:fixed;left:0;top:var(--h);bottom:0;right:416px;background:var(--stage);overflow:hidden}
.float{position:fixed;left:16px;right:432px;top:calc(var(--h) + 12px);z-index:4}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#06201c}
.chip:focus-visible,.mk:focus-visible,.ib:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sub{color:var(--mute);font-size:12px;margin-top:8px;max-width:620px}
#side{position:fixed;right:16px;top:calc(var(--h) + 12px);bottom:16px;width:400px;padding:20px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;overflow:auto;z-index:4}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h2{font-weight:800;font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px;background:var(--chip)}
.card h3{margin-top:0}.card p{margin:0 0 6px}
.mkt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 4px}
.mkt span{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mute)}
.mkt b{display:block;font-size:16px;font-weight:700;color:var(--ink)}
.up{color:var(--acc)}.down{color:var(--amb)}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line)}
li a{color:var(--ink);text-decoration:none;font-weight:600}li a:hover{text-decoration:underline}
li a.cn{color:var(--acc);font-size:12px;font-weight:700}
.tag{font-size:12px;color:var(--mute);display:block;margin-bottom:2px}
.ic{width:16px;height:16px;vertical-align:-3px;color:var(--acc)}
.chip[aria-pressed="true"] .ic{color:#06201c}
.hint,.mut{color:var(--mute);font-size:13px;margin:6px 0 0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.pt{margin-top:18px;padding:12px 14px;border:1px solid var(--acc);border-radius:12px}.pt h3{margin-top:0}.pt li{padding:7px 0;font-size:13px}
.note{margin-top:16px;font-size:11.5px;color:var(--mute)}
.mk{position:relative;border-radius:50%;background:#f2b441;border:0;cursor:pointer;box-shadow:0 0 0 4px #f2b44145;padding:0;pointer-events:auto}
.mk::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.mk.on{background:#4fd1c0;box-shadow:0 0 0 6px #4fd1c040}
.px{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}.px i{font-size:13px;font-weight:700;font-style:normal;margin-left:6px}
.chart{width:100%;height:120px;display:block}
.ax{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:2px 0 8px}
.tr{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute)}.tr i{font-style:normal;font-weight:700}.tr b{color:var(--ink)}
.per{display:flex;gap:4px}.pill{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;font:inherit;font-size:11px;font-weight:700;padding:2px 9px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#06201c}
.card .hd{align-items:center}.card .hd h3{margin:0}
@media (max-width:820px){
 .brand span,.search input{display:none}.search input:focus{display:block;position:fixed;left:12px;right:12px;top:10px;width:auto;z-index:9}
 #stage{right:0;bottom:44vh}
 .float{right:12px;left:12px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.sub{display:none}
 #side{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:42vh;padding:16px}
 .fx{margin-left:0;flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let cat="all",sel=null,g=null,W=null,FX={},FXD="",LAY="off",IDX={},PER=63,hov=null,UPD="sem dados",PTS=[];

[["Polónia",52,19,"PLN","WIG20",0.9,"Poland","Maior economia da Europa de Leste dentro da UE, com indústria e serviços em expansão.","O WIG20 reúne grandes bancos, energia e retalho, com muito peso do setor financeiro.","Banco central, zloty e fundos europeus."],

["Noruega",61,9,"NOK","OSEBX",0.4,"Norway","Grande exportadora de petróleo e gás, com o maior fundo soberano do mundo.","A bolsa de Oslo é muito ligada à energia, ao mar (pesca, aquacultura) e à banca.","Preço do petróleo e do gás, coroa norueguesa."],

["Áustria",47.5,14.5,"EUR","ATX",0.45,"Austria","Economia industrial e exportadora ligada à Alemanha e à Europa Central.","O ATX é pequeno, com bancos, energia e industriais.","Bancos com negócio no Leste europeu e preços da energia."],
["Grécia",39,22,"EUR","Athex",0.2,"Greece","Economia assente em turismo e transporte marítimo, em recuperação após a crise da dívida.","A bolsa de Atenas tem forte presença de bancos, que dominam a recuperação do índice.","Bancos, turismo e rating da dívida."],

["Hong Kong",22.3,114.2,"HKD","Hang Seng",0.35,"Hong Kong","Porta financeira entre a China e o resto do mundo.","O Hang Seng pesa em bancos, tecnologia chinesa, seguradoras e imobiliário.","Economia da China, juros dos EUA e regulação."],
["Tailândia",15,101,"THB","SET",0.5,"Thailand","Economia exportadora e turística do Sudeste Asiático.","A SET tem energia, bancos, retalho e turismo.","Turismo, exportações e banco central."],
["Malásia",4.2,102,"MYR","KLCI",0.4,"Malaysia","Exportadora de eletrónica, óleo de palma e energia.","O KLCI junta bancos, utilities, plantações e telecomunicações.","Preço do óleo de palma e petróleo, e ringgit."],
["Vietname",16,106,"VND","VN-Index",0.4,"Vietnam","Polo de produção em crescimento, com cadeias de fornecimento da eletrónica.","O VN-Index é dominado por bancos, imobiliário e investidores particulares.","Exportações, crédito e imobiliário."],
["Filipinas",12.5,122,"PHP","PSEi",0.4,"Philippines","Economia de consumo apoiada em remessas e serviços.","O PSEi pesa em imobiliário, bancos, holdings e telecomunicações.","Remessas, inflação e peso filipino."],
["Chile",-33,-71,"CLP","IPSA",0.3,"Chile","Maior produtor mundial de cobre e importante exportador de lítio.","O IPSA junta retalho, bancos, energia e mineração.","Preço do cobre, peso chileno e política interna."],
["Colômbia",4.5,-73,"COP","COLCAP",0.35,"Colombia","Exportadora de petróleo, carvão e café.","O COLCAP é concentrado em energia, bancos e holdings.","Petróleo, peso colombiano e política fiscal."],
["Peru",-10,-75,"PEN","S&P/BVL",0.2,"Peru","Grande produtor de cobre, ouro e prata.","A bolsa de Lima é pequena e muito ligada à mineração e aos bancos.","Preço dos metais e política interna."],
["Marrocos",32,-6,"MAD","MASI",0.15,"Morocco","Hub industrial e exportador para a Europa, com fosfatos e automóvel.","A bolsa de Casablanca tem bancos, telecomunicações e construção.","Fosfatos, turismo e ligação à economia europeia."],
["Quénia",0.5,38,"KES","NSE 20",0.1,"Kenya","Centro financeiro e tecnológico da África Oriental.","A NSE tem bancos e telecomunicações, com forte peso do pagamento móvel.","Xelim, inflação e dívida pública."],
["Paquistão",30,70,"PKR","KSE-100",0.3,"Pakistan","Grande população e economia dependente de financiamento externo.","O KSE-100 pesa em energia, bancos e cimento.","Acordos com o FMI, rupia e inflação."],
["Qatar",25.3,51.2,"QAR","QE Index",0.2,"Qatar","Grande exportador de gás natural liquefeito.","A bolsa do Qatar é dominada por bancos e energia.","Preço do gás natural e investimentos do fundo soberano."],
["Nova Zelândia",-41,174,"NZD","NZX 50",0.2,"New Zealand","Exportadora agrícola (lacticínios, carne) e turismo.","O NZX 50 tem utilities, saúde, telecomunicações e infraestruturas.","Preços dos lacticínios, banco central e China."]
].forEach(r=>{D.push([r[0],r[1],r[2],r[3],r[4],0,[]]);INF[r[0]]=[r[5],r[7]];MKT[r[0]]=[r[8],r[9]];NM[r[0]]=r[6]});
const items=c=>c[6].filter(n=>cat==="all"||n[0]===cat);
const visible=()=>cat==="all"?D:D.filter(c=>items(c).length);
const chg=v=>v==null?"—":`<i class="${v>=0?"up":"down"}">${v>=0?"▲":"▼"}${fmt(Math.abs(v),2)}%</i>`;
const capColor=f=>{
  if(!f.properties)return"#1f6b5c";
  const c=byEN[f.properties.name];
  if(!c)return"#16414f";
  if(LAY==="fx"){const x=FX[c[3]];if(x&&c[3]!=="EUR"){const v=-x.chg;if(v>0.02)return"#4fd1c0";if(v<-0.02)return"#f2b441"}return"#2a6f66"}
  if(LAY==="idx"){const x=IDX[c[0]],v=x&&x.chg?x.chg["1d"]:null;if(v!=null){if(v>0.05)return"#4fd1c0";if(v<-0.05)return"#f2b441"}return"#2a6f66"}
  return sel===c?"#4fd1c0":hov===f?"#37a893":"#2a8a77"};
const leg=()=>{$("leg").innerHTML=LAY==="fx"?`<span style="color:#4fd1c0">■</span> moeda valorizou face ao euro · <span style="color:#f2b441">■</span> desvalorizou · variação diária, referência BCE${FXD?" de "+FXD:""}.`:LAY==="idx"?'<span style="color:#4fd1c0">■</span> índice em alta na última sessão · <span style="color:#f2b441">■</span> em baixa · cinzento: sem dados.':""};
const fxSpan=c=>{const eur=c[3]==="EUR",f=FX[eur?"USD":c[3]];
  if(!f)return'<span>Câmbio BCE<b>sem referência</b></span>';
  const ch=eur?f.chg:-f.chg;
  return`<span>${eur?"EUR/USD":"1 EUR em "+c[3]}<b>${fmt(f.rate,4)}</b></span><span>${eur?"Euro face ao dólar":"Moeda face ao euro"}<b class="${ch>=0?"up":"down"}">${ch>=0?"▲":"▼"} ${fmt(Math.abs(ch),2)}%</b></span>`};
const tag=n=>`<span class="tag">${CATS[n[0]][1]} ${CATS[n[0]][0]} · ${esc(n[4])} · ${ago(n[5])}</span>`;
const link=n=>`<a href="${/^https?:\/\//.test(n[3])?esc(n[3]):"#"}" target="_blank" rel="noopener noreferrer">${esc(n[1])}</a>`;
const newsList=c=>{const it=items(c);return it.length?"<ul>"+it.map(n=>`<li>${tag(n)}${link(n)}</li>`).join("")+"</ul>":'<p class="hint">Sem notícias recentes das fontes configuradas.</p>'};
const bp=()=>PTS.length?`<div class="pt"><h3>Banco de Portugal (BPstat)</h3><ul>${PTS.map(s=>`<li><b>${esc(s.label)}:</b> ${esc(String(s.value).replace(".",","))}${s.period?" ("+esc(s.period)+")":""}</li>`).join("")}</ul></div>`:"";

function chartCard(c){
  const x=IDX[c[0]];
  if(!x||!x.v||x.v.length<5)return`<div class="card"><h3>Índice · ${esc(c[4])}</h3><p class="mut">Sem dados de gráfico para este índice na última atualização.</p></div>`;
  const n=Math.min(PER,x.v.length),v=x.v.slice(-n),d=x.d.slice(-n),lo=Math.min(...v),hi=Math.max(...v),w=320,h=120,p=6;
  const X=i=>p+i*(w-2*p)/(v.length-1),Y=y=>h-p-(y-lo)/((hi-lo)||1)*(h-2*p);
  const pts=v.map((y,i)=>X(i).toFixed(1)+","+Y(y).toFixed(1)).join(" "),col=v[v.length-1]>=v[0]?"var(--acc)":"var(--amb)";
  const per=[[21,"1M"],[63,"3M"],[126,"6M"]].map(([k,l])=>`<button class="pill" data-p="${k}" aria-pressed="${k===PER}">${l}</button>`).join("");
  const T={alta:"Alta",baixa:"Baixa",lateral:"Lateral"}[x.trend]||"—";
  return`<div class="card"><div class="hd"><h3>${esc(c[4])}</h3><div class="per">${per}</div></div>
  <div class="px">${x.last.toLocaleString("pt-PT",{maximumFractionDigits:2})}${chg(x.chg["1d"])}</div>
  <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Evolução do índice ${esc(c[4])}"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="${X(0)},${h} ${pts} ${X(v.length-1)},${h}" fill="url(#gr)"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
  <div class="ax"><span>${d[0]}</span><span>mín ${lo.toLocaleString("pt-PT",{maximumFractionDigits:0})} · máx ${hi.toLocaleString("pt-PT",{maximumFractionDigits:0})}</span><span>${d[d.length-1]}</span></div>
  <div class="tr">${[["1 sem","1w"],["1 mês","1m"],["3 meses","3m"]].map(([l,k])=>`<span>${l} ${chg(x.chg[k])}</span>`).join("")}<span>Tendência <b>${T}</b></span></div>
  <p class="mut">Fecho diário. Tendência: média de 20 dias face à de 50. Fonte: Yahoo Finance (não oficial).</p></div>`}
function home(){
  const all=[];D.forEach(c=>items(c).forEach(n=>all.push([c,n])));
  all.sort((a,b)=>(b[1][5]||"").localeCompare(a[1][5]||""));
  const nC=D.filter(c=>items(c).length).length;
  const mv=Object.entries(IDX).filter(([k,x])=>x.chg&&x.chg["1d"]!=null).map(([k,x])=>[k,x.chg["1d"],D.find(c=>c[0]===k)]).filter(a=>a[2]).sort((a,b)=>b[1]-a[1]);
  const row=([k,v,c])=>`<li><a class="cn" href="#" data-c="${esc(k)}">${esc(k)}</a> <span class="mut">${esc(c[4])}</span> ${chg(v)}</li>`;
  side.innerHTML=`<h2>Em destaque</h2><p class="mut">${all.length} notícias de ${nC} países · atualizado ${UPD}</p>`+
   (mv.length>=6?`<h3>Bolsas na última sessão</h3><ul>${mv.slice(0,3).map(row).join("")}${mv.slice(-3).reverse().map(row).join("")}</ul>`:"")+
   `<h3>Últimas notícias</h3>`+
   (all.length?"<ul>"+all.slice(0,12).map(([c,n])=>`<li>${tag(n)}<a class="cn" href="#" data-c="${esc(c[0])}">${esc(c[0])}</a><br>${link(n)}</li>`).join("")+"</ul>":'<p class="hint">Ainda sem notícias. Escolhe um país no globo ou corre o workflow no GitHub.</p>')+
   '<p class="note">Toca num país no globo, ou procura-o em cima, para ver mercado, notícias e influência.</p>';
}
function drawSide(){
  side.scrollTop=0;
  if(!sel)return home();
  const m=MKT[sel[0]]||["",""];
  side.innerHTML=`<div class="hd"><h2>${sel[0]}</h2><button class="ib" data-x aria-label="Fechar">✕</button></div>
  <div class="mkt"><span>Moeda<b>${sel[3]}</b></span><span>Índice<b>${sel[4]}</b></span>${fxSpan(sel)}</div>
  ${chartCard(sel)}
  <h3>Notícias</h3>${newsList(sel)}
  <div class="card"><h3>Mercado de ações · ${sel[4]}</h3><p>${m[0]}</p><p class="mut"><b>A acompanhar:</b> ${m[1]}</p></div>
  ${infl(sel)}
  <p class="note">Atualizado: ${UPD}. Câmbios: referência BCE${FXD?" de "+FXD:""}. As análises de mercado e de influência são contexto geral, não refletem o dia e não são aconselhamento financeiro.</p>`;
}
side.onclick=e=>{
  const b=e.target.closest("[data-c]");if(b){e.preventDefault();return pick(D.find(c=>c[0]===b.dataset.c))}
  const q=e.target.closest("[data-p]");if(q){PER=+q.dataset.p;const st=side.scrollTop;drawSide();side.scrollTop=st;return}
  if(e.target.closest("[data-x]")){sel=null;if(g){g.controls().autoRotate=true;refresh()}drawSide()}
};
function drawChips(){
  $("chips").innerHTML="";
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement("button");
    b.className="chip";b.innerHTML=(v[1]?v[1]+" ":"")+v[0];
    b.setAttribute("aria-pressed",k===cat);
    b.onclick=()=>{cat=k;drawChips();refresh();if(sel&&!items(sel).length)sel=null;drawSide()};
    $("chips").appendChild(b);
  });
  [["fx","Câmbios BCE",'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',"Colorir os países pela variação diária da moeda face ao euro"],["idx","Bolsas (dia)",'<path d="M4 18l5-6 4 3 7-9"/>',"Colorir os países pela variação do índice na última sessão"]].forEach(([k,l,ic,tt])=>{
    const t=document.createElement("button");
    t.className="chip";t.innerHTML=I(ic)+" "+l;t.title=tt;t.setAttribute("aria-pressed",LAY===k);
    t.onclick=()=>{LAY=LAY===k?"off":k;drawChips();if(g)g.polygonCapColor(capColor);leg()};
    $("chips").appendChild(t);
  });
}
function pick(c){
  sel=c;g.controls().autoRotate=false;
  g.pointOfView({lat:c[1],lng:c[2],altitude:1.7},900);
  refresh();drawSide();
}
function refresh(){g.htmlElementsData(visible());g.ringsData(visible().filter(c=>c[6].length));g.polygonCapColor(capColor)}
function init(){
  g=Globe()(stage)
    .backgroundColor("rgba(0,0,0,0)")
    .showAtmosphere(true).atmosphereColor("#4fd1c0").atmosphereAltitude(0.15)
    .showGraticules(true)
    .polygonsData(W||L).polygonCapColor(capColor).polygonSideColor(()=>"rgba(0,0,0,0)").polygonStrokeColor(()=>"#0b1d3a").polygonAltitude(0.006)
    .polygonLabel(f=>{const c=f.properties&&byEN[f.properties.name];return`<div style="font:600 12px Manrope,sans-serif;padding:3px 8px;border-radius:6px;background:#0b1d3aee;color:#e8eef5">${esc(c?c[0]:(f.properties?f.properties.name:""))}${c?" · "+c[6].length+" notícias":""}</div>`})
    .onPolygonHover(f=>{hov=f;g.polygonCapColor(capColor);stage.style.cursor=f&&f.properties&&byEN[f.properties.name]?"pointer":"grab"})
    .onPolygonClick(f=>{const c=f&&f.properties&&byEN[f.properties.name];if(c)pick(c)})
    .ringLat(d=>d[1]).ringLng(d=>d[2]).ringColor(()=>t=>`rgba(242,180,65,${(1-t)*.55})`).ringMaxRadius(2.4).ringPropagationSpeed(1.1).ringRepeatPeriod(2400)
    .htmlLat(d=>d[1]).htmlLng(d=>d[2]).htmlAltitude(0.01)
    .htmlElement(d=>{
      const b=document.createElement("button");
      const s=Math.round(12+Math.sqrt(INF[d[0]][0])*3);b.style.width=b.style.height=s+"px";
      b.className="mk"+(sel===d?" on":"");if(!d[6].length)b.style.opacity=.45;
      b.title=d[0];b.setAttribute("aria-label",d[0]);
      b.onclick=()=>pick(d);
      return b;
    });
  g.globeMaterial().color.set("#0b1d3a");
  const c=g.controls();c.autoRotate=true;c.autoRotateSpeed=0.5;
  g.pointOfView({lat:30,lng:-10,altitude:2.3});
  const fit=()=>g.width(stage.clientWidth).height(stage.clientHeight);
  fit();new ResizeObserver(fit).observe(stage);
  refresh();
}
function apply(J){
  UPD=J&&J.updated?new Date(J.updated).toLocaleString("pt-PT",{dateStyle:"short",timeStyle:"short"}):"sem dados";
  PTS=(J&&J.portugal)||[];FX=(J&&J.fx)||{};IDX=(J&&J.idx)||{};FXD=(Object.values(FX)[0]||{}).date||"";
  D.forEach(c=>{byEN[NM[c[0]]]=c;c[6]=((J&&J.countries&&J.countries[c[0]])||[]).map(n=>[n.cat,n.title,0,n.url,n.source,n.date])});
  $("fx").innerHTML=["USD","GBP","JPY","CHF","CNY","BRL"].filter(k=>FX[k]).map(k=>{const f=FX[k];return`<span>EUR/${k} <b>${fmt(f.rate,k==="JPY"?2:4)}</b> <i class="${f.chg>=0?"up":"down"}">${f.chg>=0?"▲":"▼"}${fmt(Math.abs(f.chg),2)}%</i></span>`}).join("");
}
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}};
let th=null;try{th=localStorage.getItem("th")}catch(e){}
setTheme(th||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
$("th").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("cl").innerHTML=D.map(c=>`<option value="${esc(c[0])}">`).join("");
$("q").oninput=e=>{const c=D.find(c=>nrm(c[0])===nrm(e.target.value.trim()));if(c&&g){pick(c);e.target.blur()}};
const jf=u=>fetch(u,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
drawChips();
Promise.all([jf("noticias.json"),jf("countries.json")]).then(([J,G])=>{W=G&&G.features?G.features:null;apply(J);start()});
function start(){try{init()}catch(e){stage.innerHTML='<p style="color:#fff;padding:20px">Não foi possível carregar o globo.</p>'}drawSide()}
</script>
